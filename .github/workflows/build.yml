name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test shared logic
        run: bash gradlew :test --no-daemon
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [forge-1.12.2, forge-1.16.5, forge-1.20.1, neoforge-1.21.1, neoforge-26.1.2, neoforge-26.2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.platform == 'forge-1.12.2' || matrix.platform == 'forge-1.16.5'
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: startsWith(matrix.platform, 'forge-')
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: startsWith(matrix.platform, 'neoforge-26.')
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build ${{ matrix.platform }}
        working-directory: versions/${{ matrix.platform }}
        run: bash gradlew build --no-daemon --console=plain
