name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neoforge-1_21_1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test shared logic
        run: bash gradlew :test --no-daemon
      - name: Build NeoForge 1.21.1
        working-directory: versions/neoforge-1.21.1
        run: bash gradlew build --no-daemon
