buildscript { repositories { maven { url='https://repo.spongepowered.org/repository/maven-public/' } }; dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' } }
plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.54' }
apply plugin: 'org.spongepowered.mixin'
mixin { add sourceSets.main, 'wrenchbridge.refmap.json'; config 'wrenchbridge.mixins.json' }
jarJar.enable()
version='0.1.0-alpha.10'
group='dev.wrenchbridge'
base.archivesName='wrenchbridge-forge-1.20.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
java.withSourcesJar()
sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.resources.srcDir '../../common/src/main/resources'
minecraft { mappings channel:'official', version:'1.20.1'; runs { client { workingDirectory project.file('run'); mods { wrenchbridge { source sourceSets.main } } }; server { workingDirectory project.file('run'); args '--nogui'; mods { wrenchbridge { source sourceSets.main } } } } }
repositories { mavenCentral() }
dependencies {
 minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
 annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
 compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.5'))
 implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.5')) { jarJar.ranged(it, '[0.5.5,)') }
}
jar { manifest { attributes 'MixinConfigs':'wrenchbridge.mixins.json' } }
tasks.named('jar') { archiveClassifier='slim' }
tasks.named('jarJar') { archiveClassifier='' }
reobf { jarJar {} }
tasks.named('jarJar') { finalizedBy 'reobfJarJar' }
tasks.named('assemble') { dependsOn tasks.named('jarJar') }

tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('META-INF/mods.toml') { expand version:project.version } }
jar.finalizedBy('reobfJar')

sourceSets { verification { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
minecraft.runs { verificationServer { parent project.minecraft.runs.server; workingDirectory project.file('run-port-verification'); jvmArgs '-Xmx2G'; property 'wrenchbridge.verify','true'; mods { wrenchbridge_verification { source sourceSets.verification } } } }

processResources { duplicatesStrategy=DuplicatesStrategy.EXCLUDE }

tasks.named('sourcesJar') { duplicatesStrategy=DuplicatesStrategy.EXCLUDE }

if(providers.gradleProperty('nativeVerification').isPresent()) {
 repositories { maven { url='https://api.modrinth.com/maven' }; maven { url='https://modmaven.dev' } }
 dependencies { runtimeOnly fg.deobf('maven.modrinth:ae2:jYgSnxye'); runtimeOnly fg.deobf('maven.modrinth:mekanism:uxe1WQp4'); runtimeOnly fg.deobf('maven.modrinth:guideme:i7Tp1AHw') }
}
