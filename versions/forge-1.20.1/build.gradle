plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.54' }
version='0.1.0-alpha.1'
group='dev.wrenchbridge'
base.archivesName='wrenchbridge-forge-1.20.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
java.withSourcesJar()
sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.resources.srcDir '../../common/src/main/resources'
minecraft { mappings channel:'official', version:'1.20.1'; runs { client { workingDirectory project.file('run'); mods { wrenchbridge { source sourceSets.main } } }; server { workingDirectory project.file('run'); args '--nogui'; mods { wrenchbridge { source sourceSets.main } } } } }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.16' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
processResources { inputs.property 'version',project.version; filesMatching('META-INF/mods.toml') { expand version:project.version } }
jar.finalizedBy('reobfJar')
