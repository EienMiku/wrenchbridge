plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}
version = '0.1.0-alpha.13'
group = 'dev.wrenchbridge'
base.archivesName = 'wrenchbridge-neoforge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
sourceSets.main.java.srcDir '../../common/src/main/java'
sourceSets.main.resources.srcDir '../../common/src/main/resources'
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = '21.1.248'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        verificationServer {
            server()
            jvmArgument '-Xmx2G'
            programArgument '--nogui'
            gameDirectory = project.file('run-verification')
            systemProperty 'wrenchbridge.verify', 'true'
        }
        verificationClient {
            client()
            jvmArgument '-Xmx4G'
            gameDirectory = project.file('run-verification-client')
            systemProperty 'wrenchbridge.verifyClient', 'true'
            systemProperty 'wrenchbridge.verifySoundOnly', providers.gradleProperty('verifySoundOnly').getOrElse('false')
            systemProperty 'wrenchbridge.verifyLevelOnly', providers.gradleProperty('verifyLevelOnly').getOrElse('false')
            programArguments.addAll '--quickPlaySingleplayer', 'WrenchBridge-RenderCheck', '--width', '800', '--height', '450'
        }
        sharingClient {
            client()
            jvmArgument '-Xmx2G'
            gameDirectory = project.file('run-sharing-client')
            systemProperty 'wrenchbridge.verifySharingClient', 'true'
            systemProperty 'wrenchbridge.verifySharingResume', providers.gradleProperty('verifySharingResume').getOrElse('false')
            programArguments.addAll '--quickPlaySingleplayer', 'Sharing-Check', '--width', '960', '--height', '600'
        }
        settingsOfflineClient {
            client()
            jvmArgument '-Xmx2G'
            gameDirectory = project.file('run-settings-offline')
            systemProperty 'wrenchbridge.verifySharingClient', 'true'
            systemProperty 'wrenchbridge.verifySettingsOffline', 'true'
            programArguments.addAll '--width', '960', '--height', '600'
        }
    }
    mods {
        wrenchbridge { sourceSet sourceSets.main }
        wrenchbridge_verification { sourceSet sourceSets.verification }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('compileVerificationJava', JavaCompile) { options.incremental = false }
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

tasks.named('sourcesJar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
