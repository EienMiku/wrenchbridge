allprojects {
    afterEvaluate { p ->
        if (p.name == 'wrenchbridge-neoforge-1.21.1' || p.projectDir.name == 'neoforge-1.21.1') {
            p.repositories { mavenCentral() }
            def bench = p.sourceSets.create('tagBenchmark') {
                java.srcDir new File(p.projectDir, '../../benchmarks/tag-lookup/src')
                compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
                runtimeClasspath += p.sourceSets.main.output + p.sourceSets.main.runtimeClasspath
            }
            p.dependencies.add(bench.implementationConfigurationName, 'org.openjdk.jmh:jmh-core:1.37')
            p.dependencies.add(bench.annotationProcessorConfigurationName, 'org.openjdk.jmh:jmh-generator-annprocess:1.37')
            p.tasks.register('tagBenchmark', JavaExec) {
                dependsOn bench.classesTaskName
                classpath = bench.runtimeClasspath
                mainClass = 'org.openjdk.jmh.Main'
                javaLauncher = p.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
                args 'dev.wrenchbridge.benchmark.TagLookupBenchmark.(baseline|production)', '-f', '2', '-wi', '3', '-w', '300ms', '-i', '5', '-r', '300ms',
                    '-jvmArgs', '-Xms256m -Xmx256m', '-rf', 'json', '-rff',
                    new File(p.projectDir, '../../.toolchains/tag-key-review/jmh-reproduced.json').absolutePath
            }
        }
    }
}
